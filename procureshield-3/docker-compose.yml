# Local one-command demo stack: PostgreSQL + Python analytics engine + Node BFF.
# The React client is built into the BFF image at build time.
#
#   docker compose up --build
#   open http://localhost:4000
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: procureshield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - procureshield-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d procureshield"]
      interval: 5s
      timeout: 5s
      retries: 10

  engine:
    build:
      context: ./engine
    environment:
      PROCURESHIELD_GRAPH_BACKEND: memory
      PROCURESHIELD_LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      PORT: 4000
      # Container-to-container: the compose service name, not localhost.
      ENGINE_URL: http://engine:8000
      DEMO_USERNAME: admin
      DEMO_PASSWORD: admin123
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/procureshield
      DATABASE_SSL: "false"
      DATABASE_SEED: "true"
      DATABASE_POOL_MAX: "10"
    ports:
      - "4000:4000"
    depends_on:
      engine:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  procureshield-postgres:
